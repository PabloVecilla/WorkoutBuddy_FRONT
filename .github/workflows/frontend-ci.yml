name: Frontend CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: workoutbuddy_user
      DB_PASSWORD: workoutbuddy_password
      DB_NAME: workoutbuddy_test
      JWT_SECRET: super_secret_change_later
      JWT_EXPIRES_IN: 24h
      COOKIE_MAX_AGE: 86400000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug files
        run: ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
    
      - name: Run build
        run: npm run build